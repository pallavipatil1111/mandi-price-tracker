name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit + integration tests (H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/mandi-price-tracker-*.jar

  mysql:
    name: Integration tests on MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mandi
          MYSQL_USER: mandi
          MYSQL_PASSWORD: mandi
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -umandi -pmandi"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run integration tests against MySQL
        env:
          SPRING_PROFILES_ACTIVE: mysql
          DB_USER: mandi
          DB_PASSWORD: mandi
          DB_URL: jdbc:mysql://localhost:3306/mandi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        run: mvn -B test -Dtest='ApiIntegrationTest'

  e2e:
    name: Playwright end-to-end
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: dist
      - name: Start the app (H2 + a year of sample prices)
        run: |
          nohup java -jar dist/mandi-price-tracker-*.jar > app.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8080/actuator/health && break; sleep 2; done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: e2e
        env:
          CI: "true"
          BASE_URL: http://localhost:8080
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            app.log

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mandi-price-tracker .
