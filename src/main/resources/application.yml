server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: mandi-price-tracker
  datasource:
    url: jdbc:h2:mem:mandi;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration); Hibernate never alters it.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      hibernate.jdbc.batch_size: 200
      hibernate.order_inserts: true
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

app:
  zone: ${APP_ZONE:Asia/Kolkata}
  # sample  = built-in generator with realistic Maharashtra prices (no key needed)
  # datagov = live Agmarknet prices from the data.gov.in API (needs DATA_GOV_API_KEY)
  source: ${PRICE_SOURCE:sample}
  demo-data: ${DEMO_DATA:true}
  import:
    enabled: ${IMPORT_ENABLED:true}
    # Agmarknet publishes during the day; import every evening (IST) and once more late at night.
    cron: ${IMPORT_CRON:0 30 19,23 * * *}
  datagov:
    base-url: ${DATA_GOV_BASE_URL:https://api.data.gov.in}
    resource-id: ${DATA_GOV_RESOURCE_ID:9ef84268-d588-465a-a308-a864a43d0070}
    api-key: ${DATA_GOV_API_KEY:}
    state: ${DATA_GOV_STATE:Maharashtra}
    state-filter-field: ${DATA_GOV_STATE_FILTER:state.keyword}
    page-size: ${DATA_GOV_PAGE_SIZE:500}
    max-pages: ${DATA_GOV_MAX_PAGES:40}
  admin:
    # Created on first start if missing. Change both for any real deployment.
    email: ${ADMIN_EMAIL:admin@mandi.local}
    password: ${ADMIN_PASSWORD:Admin@12345}
  jwt:
    # Override in every real deployment: JWT_SECRET must be at least 32 characters.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:1440}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
